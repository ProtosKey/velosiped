category: systems
status: done
name: velosiped

description: >
  Собственная система контроля версий (vls), написанная с нуля на чистом
  C23 поверх POSIX-системных вызовов - без готовых библиотек, только файлы,
  дескрипторы и хеши.

stack:
  - C23
  - POSIX
  - OpenSSL
  - CMake
  - CTest
  - cJSON

possibilities:
  - "Полный цикл: init, add, commit, log, status, reset, drop."
  - "Хранилище objects/ - append-only и content-addressed: файлы адресуются по MD5-хешу, старые версии не затираются."
  - История коммитов - односвязный список, каждый коммит хранит хеш родителя.
  - При commit удалённые файлы автоматически помечаются как DELETED, без отдельной команды rm.
  - reset честно восстанавливает любое прошлое состояние, но не подчищает лишние файлы в working tree.
